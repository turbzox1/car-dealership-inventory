services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dealership
      POSTGRES_PASSWORD: dealership
      POSTGRES_DB: dealership
    ports:
      # Localhost only: the dev database (weak password) must not be reachable from the network
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the separate test database on first start
      - ./backend/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql

volumes:
  pgdata:
