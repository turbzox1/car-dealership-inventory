name: Backend CI

on:
  push:
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend-ci.yml']

# Tests only need to read the code; nothing here writes to the repository
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dealership
          POSTGRES_PASSWORD: dealership
          POSTGRES_DB: dealership_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dealership"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Integration tests and their global setup (prisma migrate deploy) use this database
      TEST_DATABASE_URL: postgresql://dealership:dealership@localhost:5432/dealership_test
      # prisma.config.ts reads DATABASE_URL; point it at the same test database
      DATABASE_URL: postgresql://dealership:dealership@localhost:5432/dealership_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run tests with coverage
        run: npm run test:coverage -- --ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 14
